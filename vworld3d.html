<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>실사 3D</title>
<!-- 브이월드 인증키: 발급 때 등록한 서비스 URL(이 사이트 주소)에서만 작동합니다 -->
<script src="https://map.vworld.kr/js/webglMapInit.js.do?version=3.0&apiKey=37C44E67-003C-4855-8409-DF368B7A3D04"></script>
<style>
html,body{margin:0;height:100%;background:#1d2126;color:#fff;font:14px/1.6 "IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
#vmap{position:absolute;inset:0}
#msg{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:#1d2126;z-index:5}
#msg[hidden]{display:none}
</style>
</head>
<body>
<div id="vmap"></div>
<div id="msg">실사 3D 지도를 여는 중…</div>
<script>
'use strict';
/* 부모 창(index.html)과 주고받는 메시지
   받기: {type:'data', buildings:[{id,name,lat,lng,h,td,sel}], focus, link}
   보내기: {type:'ready'} / {type:'open', id} / {type:'pick', td_id, model_name} / {type:'error', msg} */
const ORIGIN=location.origin==='null'?'*':location.origin;
const post=m=>{if(parent!==window)parent.postMessage(m,ORIGIN)};
const msg=t=>{const el=document.getElementById('msg');el.hidden=!t;if(t)el.textContent=t};
let viewer=null,data=[],linkMode=false,byTd=new Map(),stamp=1;
const hooked=new Set();

if(typeof vw==='undefined'){
  msg('브이월드 3D를 불러오지 못했어요. 인터넷 연결과 브이월드 인증키를 확인하세요.');
  post({type:'error',msg:'브이월드 3D를 불러오지 못했어요'});
}else{
  const map=new vw.Map();
  map.setOption({mapId:'vmap',
    initPosition:new vw.CameraPosition(new vw.CoordZ(126.99,37.49,9000),new vw.Direction(0,-50,0)),
    logo:true,navigation:true});
  map.start();
  vw.ws3dInitCallBack=function(){
    viewer=ws3d.viewer;msg('');
    setupClick();setInterval(hookTilesets,1500);hookTilesets();
    post({type:'ready'});
  };
}
setTimeout(()=>{if(!viewer){
  const t='실사 3D 지도가 열리지 않았어요. 브이월드 인증키의 서비스 URL에 이 사이트 주소가 등록돼 있는지 확인하세요.';
  msg(t);post({type:'error',msg:t});
}},25000);

addEventListener('message',e=>{
  if(e.source!==parent)return;
  if(location.origin!=='null'&&e.origin!==location.origin)return;
  const d=e.data||{};if(d.type!=='data'||!viewer)return;
  data=Array.isArray(d.buildings)?d.buildings:[];linkMode=!!d.link;
  byTd=new Map(data.filter(b=>b.td).map(b=>[String(b.td),b]));
  drawLabels();stamp++;viewer.scene.requestRender&&viewer.scene.requestRender();
  if(d.focus)focusOn(d.focus);
});

function drawLabels(){
  for(const en of viewer.entities.values.slice())if(String(en.id).startsWith('b:'))viewer.entities.remove(en);
  for(const b of data){
    if(!isFinite(b.lat)||!isFinite(b.lng))continue;
    viewer.entities.add({id:'b:'+b.id,
      position:Cesium.Cartesian3.fromDegrees(b.lng,b.lat,(+b.h||40)+15),
      point:{pixelSize:b.sel?12:8,color:Cesium.Color.fromCssColorString(b.sel?'#E3A008':'#0E5E66'),outlineColor:Cesium.Color.WHITE,outlineWidth:2,
        heightReference:Cesium.HeightReference.RELATIVE_TO_GROUND,disableDepthTestDistance:Number.POSITIVE_INFINITY},
      label:{text:String(b.name),font:'600 13px sans-serif',fillColor:Cesium.Color.WHITE,style:Cesium.LabelStyle.FILL,
        showBackground:true,backgroundColor:Cesium.Color.fromCssColorString(b.sel?'#8A5A00':'#1B2A2F').withAlpha(.85),
        pixelOffset:new Cesium.Cartesian2(0,-16),verticalOrigin:Cesium.VerticalOrigin.BOTTOM,
        heightReference:Cesium.HeightReference.RELATIVE_TO_GROUND,disableDepthTestDistance:Number.POSITIVE_INFINITY,
        distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0,b.sel?1e6:6000)}});
  }
}
function focusOn(id){
  const b=data.find(x=>x.id===id);if(!b)return;const h=+b.h||60;
  viewer.camera.flyToBoundingSphere(new Cesium.BoundingSphere(Cesium.Cartesian3.fromDegrees(b.lng,b.lat,h/2+30),Math.max(80,h*.6)),
    {offset:new Cesium.HeadingPitchRange(0,Cesium.Math.toRadians(-28),Math.max(450,h*3)),duration:1.8});
}
/* 연결된 관리 빌딩은 브이월드 건물에 색을 입혀 강조 */
function hookTilesets(){
  const walk=col=>{for(let i=0;i<col.length;i++){const p=col.get(i);
    if(p instanceof Cesium.Cesium3DTileset){if(!hooked.has(p)){hooked.add(p);p.tileVisible.addEventListener(onTile)}}
    else if(p&&typeof p.length==='number'&&typeof p.get==='function')walk(p)}};
  try{walk(viewer.scene.primitives)}catch(_){}
}
const C_LINK=()=>Cesium.Color.fromCssColorString('#7FD6D9');
const C_SEL=()=>Cesium.Color.fromCssColorString('#F2B632');
function onTile(tile){
  const c=tile.content;if(!c||c._chm===stamp)return;c._chm=stamp;
  const n=c.featuresLength||0;
  for(let i=0;i<n;i++){
    const f=c.getFeature(i);let td;try{td=f.getProperty('TD_ID')}catch(_){}
    const b=td!=null&&byTd.get(String(td));
    if(b){f.color=b.sel?C_SEL():C_LINK();f._chm=1}
    else if(f._chm){f.color=Cesium.Color.WHITE;f._chm=0}
  }
}
function setupClick(){
  const h=new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
  h.setInputAction(ev=>{
    const p=viewer.scene.pick(ev.position);if(!Cesium.defined(p))return;
    if(p.id&&typeof p.id.id==='string'&&p.id.id.startsWith('b:')){post({type:'open',id:p.id.id.slice(2)});return}
    if(p instanceof Cesium.Cesium3DTileFeature){
      let td,mn;try{td=p.getProperty('TD_ID');mn=p.getProperty('MODEL_NAME')}catch(_){}
      if(td==null)return;
      if(linkMode){post({type:'pick',td_id:String(td),model_name:mn==null?'':String(mn)});return}
      const b=byTd.get(String(td));if(b)post({type:'open',id:b.id});
    }
  },Cesium.ScreenSpaceEventType.LEFT_CLICK);
}
</script>
</body>
</html>
