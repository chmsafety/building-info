<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.kakaocdn.net https://*.daumcdn.net https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://*.supabase.co; connect-src https://*.supabase.co wss://*.supabase.co https://tiles.openfreemap.org https://tile.openstreetmap.org; worker-src 'self' blob:; manifest-src 'self'; child-src blob:; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Building · CHM 빌딩정보시스템</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1E8CF5">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Building">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="Building">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="anonymous">
<style>
:root{--bg:#EEF1F0;--paper:#fff;--ink:#1B2A2F;--ink2:#51636A;--line:#D5DDDD;--pin:#0E5E66;--hi:#E3A008;--warn:#B4461B;--chip:#E4ECEB;--ok:#1F7A4D}
@media (prefers-color-scheme:dark){:root{--bg:#121A1C;--paper:#19242A;--ink:#E6EDEC;--ink2:#A9BCC0;--line:#2C3B41;--pin:#6FD3D6;--hi:#F2B632;--warn:#F08A5D;--chip:#24343A;--ok:#6FD39A}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.hidden{display:none!important}
.btn{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-weight:500}
.btn.pri{background:var(--pin);border-color:var(--pin);color:var(--paper)}
.btn.warn{color:var(--warn);border-color:var(--warn)}
.btn:disabled{opacity:.45;cursor:default}
.err{color:var(--warn);font-size:13px;min-height:1em}
.hint{font-size:12px;color:var(--ink2)}
input,select,textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%}
label{font-size:12px;color:var(--ink2);font-weight:500}

/* login */
#login{min-height:100%;display:grid;place-items:center;padding:24px}
.login-card{width:min(380px,100%);background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:28px 26px}
.login-card h1{font-size:20px;margin:0 0 4px;letter-spacing:-.02em}
.login-card .f{display:grid;gap:4px;margin-top:14px}
.login-card .btn{width:100%;margin-top:18px;padding:11px}
.keep{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;color:var(--ink)}.keep input{width:auto}

/* app */
.app{display:grid;grid-template-rows:auto auto 1fr;height:100vh}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
.brand{display:flex;align-items:center;gap:8px}.brand img{height:26px;width:auto;display:block}
.login-card .brand img{height:34px}
.who{margin-left:auto;position:relative}
.who>button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:5px 10px 5px 12px}
.role{font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--chip);color:var(--ink2)}
.role.admin{background:var(--ink);color:var(--paper)}.role.editor{background:var(--pin);color:var(--paper)}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--paper);border:1px solid var(--line);border-radius:10px;min-width:170px;padding:6px;z-index:2000;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px}
.menu button:hover{background:var(--bg)}
.zones{display:grid;gap:6px;padding:8px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.zrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.zone{flex:none;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--paper);font-size:13px;white-space:nowrap}
.zone[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.zlbl{flex:none;width:46px;font-size:12px;color:var(--ink2);font-weight:600}
.zone small{opacity:.7;margin-left:4px}
main{display:grid;grid-template-columns:1fr 440px;min-height:0}
#map{min-height:0;height:100%;background:#dde6e7}
#map .maplibregl-canvas{outline:none}
.maplibregl-ctrl-attrib{font-size:11px}
.tmp-pin{width:28px;height:28px;border:3px dashed var(--hi);border-radius:50%}
.map3d{position:absolute;left:10px;top:10px;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.maplegend{position:absolute;left:10px;bottom:28px;z-index:5;display:flex;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.maplegend:empty{display:none}
/* 나라장터 입찰 진행 중인 빌딩: 지도 위 깜빡이는 표시 */
.bidpin{position:relative;width:18px;height:18px;cursor:pointer;border:0;padding:0;background:none}
.bidpin i{position:absolute;inset:0;border-radius:50%;background:#D92D20;border:2px solid #fff;box-shadow:0 0 0 1px #D92D20}
.bidpin::before,.bidpin::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:3px solid #D92D20;animation:bidping 1.6s ease-out infinite;pointer-events:none}
.bidpin::after{animation-delay:.8s}
.bidpin b{position:absolute;z-index:2;left:50%;bottom:calc(100% + 12px);box-shadow:0 1px 4px rgba(0,0,0,.25);transform:translateX(-50%);background:#D92D20;color:#fff;font-size:11px;font-weight:700;padding:1px 6px;border-radius:99px;white-space:nowrap;animation:bidblink 1.2s steps(2,start) infinite}
/* 이미 끝난 입찰: 깜빡이지 않는 회색 표시 */
.bidpin.done{width:14px;height:14px}
.bidpin.done i{background:#98A2B3;box-shadow:0 0 0 1px #98A2B3}
.bidpin.done::before,.bidpin.done::after{display:none}
.bidpin.done b{background:#667085;animation:none;bottom:calc(100% + 8px);font-weight:600}
@keyframes bidping{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.4);opacity:0}}
@keyframes bidblink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.bidpin::before,.bidpin::after,.bidpin b{animation:none}.bidpin::before{transform:scale(1.8);opacity:.5}}
.sbox{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sbox.on{border-color:var(--pin)}
.sbox .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sbox .hd b{font-size:14px}.sbox .hd .btn{margin-left:auto;padding:4px 10px;font-size:12px}
.stg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stg button{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:4px 10px;font-size:12px;display:inline-flex;gap:6px;align-items:center}
.stg button[aria-pressed="true"]{outline:2px solid var(--pin)}
.stg button b{font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.stag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;color:#fff;margin-left:4px;vertical-align:1px}
.todo{list-style:none;margin:8px 0 0;padding:0;font-size:13px}
.todo li{padding:7px 0;border-top:1px dashed var(--line);display:grid;grid-template-columns:1fr auto;gap:2px 8px}
.todo .t{font-weight:600}.todo .m{font-size:12px;color:var(--ink2);grid-column:1/3}
.todo .d{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--chip);color:var(--ink2);white-space:nowrap}
.todo .d.now{background:#D92D20;color:#fff}.todo .d.soon{background:var(--hi);color:#1B2A2F}
.todo .bn{border:0;background:none;padding:0;color:var(--pin);font-weight:600;font-size:13px;text-align:left}
.acts{list-style:none;margin:8px 0 0;padding:0;font-size:13px}
.acts li{padding:6px 0;border-bottom:1px dashed var(--line)}
.acts .m{font-size:11px;color:var(--ink2)}
.acts .x{border:0;background:none;color:var(--ink2);font-size:11px;text-decoration:underline;padding:0;float:right}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.legbtn{border:0;background:var(--chip);border-radius:99px;padding:2px 8px;font-size:11px;font-weight:600;color:var(--ink)}
.bidbox{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.bidbox.on{border-color:#D92D20}
.bidbox .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bidbox .hd b{font-size:14px}.bidbox .hd .btn{margin-left:auto;padding:4px 10px;font-size:12px}
.bidk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.bidk button{border:0;background:var(--bg);border-radius:8px;padding:6px 8px;text-align:left}
.bidk button[aria-pressed="true"]{outline:2px solid #D92D20}
.bidk b{display:block;font-size:17px;font-variant-numeric:tabular-nums}.bidk span{font-size:11px;color:var(--ink2)}
.bids{list-style:none;margin:8px 0 0;padding:0;font-size:13px}
.bids li{padding:7px 0;border-top:1px dashed var(--line);display:grid;gap:2px}
.bids .t{font-weight:600}.bids .t a{color:inherit}
.bids .m{font-size:12px;color:var(--ink2)}
.bids .bn{border:0;background:none;padding:0;color:var(--pin);font-weight:600;font-size:12px;text-align:left}
.dday{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:#D92D20;color:#fff;margin-right:4px}
.pubtag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:#3B5BA9;color:#fff;margin-left:4px;vertical-align:1px}
.dday.end{background:var(--chip);color:var(--ink2)}.dday.win{background:var(--ok);color:var(--paper)}.dday.new{background:var(--hi);color:#1B2A2F}
.bids .hide{border:0;background:none;color:var(--ink2);font-size:11px;padding:0;text-decoration:underline;justify-self:start}
.bids li.hid{opacity:.5}
.tabs{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.v3{position:absolute;inset:0;z-index:20;background:#1d2126}
.v3 iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.v3bar{position:absolute;left:10px;top:10px;right:60px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:2;pointer-events:none}
.v3bar>*{pointer-events:auto}
.v3bar span{background:var(--ink);color:var(--paper);padding:7px 12px;border-radius:8px;font-size:13px}
.v3bar span:empty{display:none}
.v3bar .link{background:var(--hi);color:#1B2A2F;font-weight:600}
.faces{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.face{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
.face .thumb{aspect-ratio:3/4;border:1px dashed var(--line);border-radius:8px;background:var(--bg) center/cover no-repeat;display:grid;place-items:center;text-align:center;font-size:11px;padding:4px;cursor:pointer;color:var(--ink2)}
.face.has .thumb{border-style:solid;color:transparent}
.face .btn{padding:3px 6px;font-size:11px}
.fx{display:grid;grid-template-columns:1fr 150px;gap:12px;margin-top:10px}
.fxc{background:#2A2F35;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:8px;touch-action:none;min-height:200px}
.fxc canvas{max-width:100%;cursor:crosshair;touch-action:none}
.fxp canvas{width:100%;border-radius:6px;background:var(--bg);margin-top:4px}
.banner{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:13px;z-index:1000}
aside{background:var(--paper);border-left:1px solid var(--line);overflow:auto;min-height:0}
.pad{padding:16px 18px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{background:var(--bg);border-radius:10px;padding:10px 10px 8px}
.kpi b{display:block;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:12px;color:var(--ink2)}
h2{font-size:20px;margin:8px 0 2px;letter-spacing:-.02em;line-height:1.3}
h3{font-size:13px;color:var(--ink2);font-weight:600;margin:20px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.bars{display:grid;gap:6px}
.barrow{display:grid;grid-template-columns:150px 1fr 36px;gap:8px;align-items:center;font-size:13px}
.cos{max-height:380px;overflow:auto;padding-right:4px}
.cos .barrow{width:100%;border:0;background:none;padding:2px 0;text-align:left;border-radius:6px}
.cos .barrow:hover{background:var(--bg)}
.cos .barrow.on{background:var(--chip);outline:2px solid var(--pin)}
.filt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--chip);font-size:13px}
.filt .btn{margin-left:auto;padding:4px 10px;font-size:12px}
.list .sub small{color:var(--ink2);margin-left:1px}
.barrow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pin)}
.bar i.none{background:var(--line)}
.barrow .n{text-align:right;font-variant-numeric:tabular-nums}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input{flex:1;min-width:140px}
.list{list-style:none;margin:10px -18px 0;padding:0}
.list button{width:100%;text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 18px;border:0;border-top:1px solid var(--line);background:none}
.list button:hover{background:var(--bg)}
.list .nm{font-weight:600}.list .sub{font-size:12px;color:var(--ink2)}
.list .num{grid-row:1/3;grid-column:2;text-align:right;font-size:13px;align-self:center;font-variant-numeric:tabular-nums}
.flag{color:var(--warn);font-size:11px;font-weight:600}
.back{border:0;background:none;color:var(--ink2);padding:0;margin-bottom:8px}
.photo{aspect-ratio:16/10;background:var(--bg);border-radius:10px;overflow:hidden;display:grid;place-items:center;color:var(--ink2);font-size:13px}
.photo img{width:100%;height:100%;object-fit:cover}
.photo iframe{width:100%;height:100%;border:0;display:block}
.phtabs{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.phtabs button{padding:4px 12px;border-radius:99px;border:1px solid var(--line);background:var(--paper);font-size:12px}
.phtabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.phtabs a{margin-left:auto;font-size:12px;color:var(--pin)}
.phsrc{font-size:11px;color:var(--ink2);margin-top:3px}.phsrc a{color:var(--ink2)}
.pf-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.pf-head h2{margin:0}
.pf-q{display:flex;gap:6px;margin-top:10px}.pf-q input{flex:1}
.pf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px;min-height:120px}
.pf-grid button{position:relative;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:var(--bg);aspect-ratio:4/3}
.pf-grid button img{width:100%;height:100%;object-fit:cover;display:block}
.pf-grid button span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;padding:2px 5px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-grid button:hover{border-color:var(--hi)}
.pf-grid button.done{border-color:var(--ok)}.pf-grid button.done::after{content:'✓ 저장됨';position:absolute;top:6px;left:6px;background:var(--ok);color:#fff;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px}
.pf-grid button.busy{opacity:.5;cursor:wait}
.pf-nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.pf-nav .sp{flex:1}
.thumbs{display:flex;gap:6px;margin-top:6px;overflow-x:auto}
.thumbs button{padding:0;border:2px solid transparent;border-radius:6px;overflow:hidden;width:58px;height:40px;flex:none;background:var(--bg)}
.thumbs button[aria-current="true"]{border-color:var(--hi)}.thumbs img{width:100%;height:100%;object-fit:cover}
dl{display:grid;grid-template-columns:92px 1fr;gap:6px 12px;margin:0}dt{color:var(--ink2)}dd{margin:0}
.big{font-size:26px;font-weight:700;letter-spacing:-.02em}
.srow{display:grid;grid-template-columns:40px 1fr 44px;gap:10px;align-items:center;font-size:13px;margin-bottom:6px}
.srow .n{text-align:right;font-weight:600}.scomp{grid-column:2/4;font-size:12px;color:var(--ink2);margin-top:-4px}
.note{font-size:12px;color:var(--ink2);background:var(--bg);border-radius:8px;padding:8px 10px;margin-top:12px;white-space:pre-wrap}
.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.hist{list-style:none;margin:0;padding:0;font-size:13px}.hist li{padding:6px 0;border-bottom:1px dashed var(--line)}.hist small{color:var(--ink2)}
form .f{display:grid;gap:4px;margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.stf{display:grid;grid-template-columns:44px 72px 1fr;gap:6px 8px;align-items:center;margin-bottom:6px}
.ph-edit{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ph-edit div{position:relative;width:74px;height:52px;border-radius:6px;overflow:hidden;background:var(--bg)}
.ph-edit img{width:100%;height:100%;object-fit:cover}
.ph-edit button{position:absolute;right:2px;top:2px;border:0;border-radius:4px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:1px 5px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,20,24,.45);display:grid;place-items:center;z-index:3000;padding:16px}
.modal>div{background:var(--paper);border-radius:14px;width:min(760px,100%);max-height:90vh;overflow:auto;padding:20px 22px}
.modal h2{margin-top:0}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--ink2);font-weight:600;font-size:12px}
td select{width:auto;padding:4px 6px}
.tbl{overflow-x:auto}
.fmbox{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap;font-size:13px}
.fmbox.on{border-color:var(--hi)}
.fmbox b{font-size:15px}.fmbox .btn{margin-left:auto;padding:5px 10px}
.sug{border:1px solid var(--hi);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13px;display:grid;gap:4px}
.sug a,dd a{color:var(--pin)}
.sug .t{font-size:11px;font-weight:600;color:var(--ink2)}
.sug .co{font-size:15px;font-weight:700}
.sug .ev{color:var(--ink2);font-size:12px;white-space:pre-wrap}
.sug .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.sug .btn{padding:4px 10px;font-size:12px}
.conf{font-size:11px;font-weight:500;padding:1px 7px;border-radius:99px;background:var(--chip);color:var(--ink2)}
.conf.c상{background:var(--ok);color:var(--paper)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;z-index:4000;font-size:13px}

@media (max-width:860px){

<script>

/* ================= 설정 ================= */
const CONFIG = {
  SUPABASE_URL: 'https://dbymktwxokbvfshlztrg.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_RHDgmlGV-m946etnPHfXaw_vy2u8uCp',   // 공개용(publishable) 키 — 공개돼도 안전
  LOGIN_DOMAIN: 'bldg.local',                         // admin-users 함수의 LOGIN_DOMAIN 과 같아야 함

/* ================= 공통 ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PY=3.305785;
const n0=v=>Math.round(+v||0).toLocaleString('ko-KR');
const fmtPy=v=>v?n0(v/PY)+'평':'—';
const fmtM2=v=>v?n0(v)+'㎡':'—';
const CATS=[['facility','시설'],['security','보안'],['cleaning','미화'],['other','기타']];
/* 영업 파이프라인 단계 */
const STAGES=[['target','타깃','#6B7FD7'],['contact','접촉','#2E90FA'],['proposal','제안','#9E77ED'],['bid','입찰','#F79009'],['won','수주(관리 중)','#12B76A'],['lost','실주','#98A2B3'],['hold','보류','#B08968']];
const SLBL=Object.fromEntries(STAGES.map(x=>[x[0],x[1]])),SCOL=Object.fromEntries(STAGES.map(x=>[x[0],x[2]]));
const ACT_KINDS=['방문','전화','메일','미팅','제안','입찰','기타'];
const ZONES=[
  {id:'all',name:'전체'},{id:'CBD',name:'도심(CBD)'},{id:'GBD',name:'강남(GBD)'},{id:'YBD',name:'여의도(YBD)'},
  {id:'MAGOK',name:'마곡·강서'},{id:'SEOUL_ETC',name:'서울 기타'},{id:'BUNDANG',name:'판교·분당'},
  {id:'GG_ETC',name:'경기 기타'},{id:'INCHEON',name:'인천·송도'}];
const ZNAME=Object.fromEntries(ZONES.map(z=>[z.id,z.name]));
function autoZone(region,district){
  district=(district||'').replace(/\s/g,'');
  if(region==='서울'){
    if(['중구','종로구'].includes(district))return 'CBD';
    if(['강남구','서초구','송파구'].includes(district))return 'GBD';
    if(['영등포구','마포구'].includes(district))return 'YBD';
    if(district==='강서구')return 'MAGOK';
    return 'SEOUL_ETC';
  }
  if(region==='경기')return district.startsWith('성남시')?'BUNDANG':'GG_ETC';
  if(region==='인천')return 'INCHEON';
  return null;
}
const staffTotal=b=>CATS.reduce((s,[k])=>s+(+(b.staff?.[k]?.n)||0),0);
/* 관리회사: 시설(fm.company)·보안·미화·기타(staff.*.company)·PM(fm.pm) 을 모두 모아 보여 줌 */
const ROLE_OF={'보안':'security','미화':'cleaning','안내':'other','PM':'pm','pm':'pm'};
const ROLE_LBL={facility:'시설',security:'보안',cleaning:'미화',other:'기타',pm:'PM'};
const ROLE_ORD=['facility','security','cleaning','other','pm'];
const coKey=s=>String(s||'').replace(/\s|\(주\)|㈜|주식회사/g,'').toLowerCase();
function splitRole(s){s=String(s||'').trim();const m=s.match(/^(.*?)\s*\(\s*(보안|미화|안내|PM|pm)\s*\)\s*$/);return m?[m[1].trim(),ROLE_OF[m[2]]]:[s,null]}
function companiesOf(b){
  const map=new Map();
  const add=(raw,role)=>{let [nm,r]=splitRole(raw);if(!nm)return;r=r||role;const k=coKey(nm);const o=map.get(k)||{name:nm,roles:[]};if(!o.roles.includes(r))o.roles.push(r);map.set(k,o)};
  add(b.fm?.company,'facility');add(b.fm?.pm,'pm');
  for(const [k] of CATS)add(b.staff?.[k]?.company,k);
  for(const o of map.values())o.roles.sort((a,c)=>ROLE_ORD.indexOf(a)-ROLE_ORD.indexOf(c));
  return [...map.values()];
}
const mgmtCos=b=>companiesOf(b).filter(o=>o.roles.some(r=>r!=='pm'));   // 시설·보안·미화·기타 중 하나라도
const roleTxt=roles=>roles.map(r=>ROLE_LBL[r]).join('·');
const hasFM=b=>mgmtCos(b).length>0;
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ================= 상태 ================= */
let sb=null, me=null, buildings=[], names={}, zone='all', query='', onlyMissing=false;
let minPy=0;   // 연면적 필터 (평): 0=전체
let pubF='all';   // 구분 필터: all / pub(공공) / priv(민간)
let fmSug=[], fmRun=null;   // 관리사 자동 검색: 검토 대기 목록, 마지막 실행
let bidLinks=[], bidRun=null, bidOnly=false, bidAny=false, bidTab='open';   // 나라장터 입찰: 빌딩과 연결된 공고, 마지막 확인
let sales={}, salesOK=true, people=[], stageF='all', colorMode='fm', myOnly=false;   // 영업 파이프라인
let mode='dash', selId=null, draft=null, placing=false, photoIdx=0, delArm=false;
let phTab=null;   // 상세화면 위쪽: 'photo'(등록 사진) | 'rv'(카카오 로드뷰) · null=자동(사진 없으면 로드뷰)
const signed=new Map(); // 사진 경로 → {url, exp}
const canEdit=()=>me&&['admin','editor'].includes(me.role);
const isAdmin=()=>me&&me.role==='admin';

/* ================= 시작 ================= */
function show(id){for(const x of ['setup','login','app'])$('#'+x).classList.toggle('hidden',x!==id)}
if(!window.supabase||CONFIG.SUPABASE_URL.includes('YOUR-')){show('setup');}
else{
  // "로그인 유지"를 선택한 경우만 localStorage, 아니면 탭을 닫으면 사라지는 sessionStorage
  const store={
    getItem:k=>(localStorage.getItem('bldg_keep')==='1'?localStorage:sessionStorage).getItem(k),
    setItem:(k,v)=>(localStorage.getItem('bldg_keep')==='1'?localStorage:sessionStorage).setItem(k,v),
    removeItem:k=>{localStorage.removeItem(k);sessionStorage.removeItem(k)}
  };
  sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY,{auth:{storage:store,persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  boot();
}
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(session&&await loadMe(session.user.id))enterApp();
  else{await sb.auth.signOut().catch(()=>{});show('login');$('#lid').focus();}
}

/* ================= 로그인 ================= */
let fails=0,lockUntil=0;
$('#loginForm').addEventListener('submit',async()=>{
  const err=$('#lerr');err.textContent='';
  if(Date.now()<lockUntil){err.textContent='로그인 시도가 많아요. 잠시 뒤 다시 시도하세요.';return}
  const id=$('#lid').value.trim().toLowerCase(),pw=$('#lpw').value;
  if(!id||!pw){err.textContent='아이디와 비밀번호를 입력하세요.';return}
  localStorage.setItem('bldg_keep',$('#lkeep').checked?'1':'0');
  $('#lbtn').disabled=true;
  const {data,error}=await sb.auth.signInWithPassword({email:id+'@'+CONFIG.LOGIN_DOMAIN,password:pw});
  $('#lbtn').disabled=false;
  if(error){fails++;if(fails>=5){lockUntil=Date.now()+60000;fails=0}
    err.textContent=/invalid/i.test(error.message)?'아이디 또는 비밀번호가 맞지 않아요.':'로그인하지 못했어요. 잠시 뒤 다시 시도하세요.';return}
  fails=0;$('#lpw').value='';
  if(!await loadMe(data.user.id)){await sb.auth.signOut();err.textContent='사용이 중지되었거나 등록되지 않은 계정이에요. 관리자에게 문의하세요.';return}
  sb.rpc('record_login').then(()=>{},()=>{});
  enterApp();
});
async function loadMe(uid){
  const {data,error}=await sb.from('profiles').select('id,login_id,name,role,active,must_change_pw').eq('id',uid).maybeSingle();
  if(error||!data||!data.active)return false;
  me=data;return true;
}
async function logout(msg){
  await sb.auth.signOut().catch(()=>{});
  me=null;buildings=[];bidLinks=[];signed.clear();close3D();drawBidPins();
  show('login');$('#lerr').textContent=msg||'';$('#lid').focus();
}
sb&&sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'&&me){me=null;show('login')}});

/* 자동 로그아웃 */
let lastAct=Date.now();
for(const ev of ['pointerdown','keydown','wheel','touchstart'])addEventListener(ev,()=>{lastAct=Date.now()},{passive:true});
setInterval(()=>{if(me&&Date.now()-lastAct>CONFIG.IDLE_MINUTES*60000)logout(CONFIG.IDLE_MINUTES+'분 동안 사용하지 않아 로그아웃했어요.')},30000);

/* ================= 앱 진입 ================= */
let map=null,mapReady=false,mapInit=false,tmpMarker=null;
async function enterApp(){
  show('app');
  $('#whoName').textContent=me.name;
  const r=$('#whoRole');r.textContent={admin:'관리자',editor:'편집자',viewer:'조회자'}[me.role];r.className='role '+me.role;
  $('#mAdmin').classList.toggle('hidden',!isAdmin());
  $('#mImport').classList.toggle('hidden',!isAdmin());
  $('#mBid').classList.toggle('hidden',!isAdmin());
  $('#mCsv').classList.toggle('hidden',!canEdit());
  $('#mBackup').classList.toggle('hidden',!isAdmin());
  $('#mPhoto').classList.toggle('hidden',!canEdit());
  if(!mapInit){mapInit=true;initMap()}
  setTimeout(()=>map&&map.resize(),50);
  await loadAll();
  if(me.must_change_pw)openPwModal(true);
}
/* ---------- 빌딩 목록 불러오기 ----------
   지도·목록에 쓰는 칸만 받아요. 사진 출처(photo_src)·메모(memo)처럼 상세에서만 쓰는 큰 칸은 빼고,
   상세를 열 때 그 빌딩 한 건만 전부 다시 받아요(ensureFull). 전국으로 늘려도 전송량이 덜 늘게. */
const LIST_COLS='id,name,address,region,district,zone,gfa,floors_above,floors_below,completed,use_type,owner,lat,lng,photos,fm,staff,model3d,verified,updated_at,updated_by';
const OPT_COLS=['is_public','bid_keywords','bid_orgs','photo_src','memo'];   // 나중에 더한 칸 — 아직 SQL을 안 돌린 프로젝트도 있어서 있는지 확인해서 써요
const DETAIL_ONLY=['photo_src','memo'];                                      // 있어도 목록에선 안 받는 칸
const HAS={};                                                                // 칸 이름 → 있으면 true
const PAGE=1000;                                                             // Supabase 'Max rows' 기본값. 이 단위로 나눠 받아요.
const RELOAD_MS=5*60000;                                                     // 창을 다시 볼 때 재로딩하는 최소 간격
async function probeCols(){
  if(Object.keys(HAS).length)return;
  const r=await Promise.all(OPT_COLS.map(c=>sb.from('buildings').select(c).limit(1)));
  OPT_COLS.forEach((c,i)=>HAS[c]=!r[i].error);
}
const listCols=()=>LIST_COLS+OPT_COLS.filter(c=>HAS[c]&&!DETAIL_ONLY.includes(c)).map(c=>','+c).join('');
/* 1000건씩 나눠 받아요 — 'Max rows' 설정 때문에 조용히 잘리는 걸 막습니다. */
async function fetchBuildings(){
  const cols=listCols();let out=[],from=0;
  for(;;){
    const {data,error}=await sb.from('buildings').select(cols)
      .order('gfa',{ascending:false,nullsFirst:false}).order('id').range(from,from+PAGE-1);
    if(error)return {error};
    out=out.concat(data||[]);
    if(!data||data.length<PAGE)break;
    from+=PAGE;
    if(from>=60000){toast('빌딩이 6만 건을 넘어 앞부분만 불러왔어요.');break}
  }
  return {data:out};
}
/* 상세·편집에서 필요한 나머지 칸을 그때 한 건만 받아 채워요. */
async function ensureFull(b){
  if(!b||b.__full)return b;
  const {data,error}=await sb.from('buildings').select('*').eq('id',b.id).maybeSingle();
  if(!error&&data)Object.assign(b,data);
  b.__full=true;   // 못 받았어도 매번 다시 조르지 않게
  return b;
}
let lastLoad=0;
async function loadAll(){
  await probeCols();
  const [bs,{data:ps}]=await Promise.all([fetchBuildings(),sb.from('profiles').select('id,name')]);
  if(bs.error){toast('자료를 불러오지 못했어요: '+bs.error.message);return}
  lastLoad=Date.now();
  buildings=bs.data||[];names=Object.fromEntries((ps||[]).map(p=>[p.id,p.name]));people=(ps||[]).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ko'));
  for(const b of buildings)if(!b.zone)b.zone=autoZone(b.region,b.district);
  await Promise.all([loadFmSug(),loadBids(),loadSales()]);
  renderZones();drawMarkers();renderPanel();
  firstFit();
  loadFacadesInView();if(v3open&&!v3link)send3D(null);
}
/* 창을 다시 볼 때마다 전체를 다시 받으면 전송량이 큽니다. 5분에 한 번만.
   (편집 중이거나 로드뷰를 보는 중엔 다시 그리지 않아요) */
addEventListener('focus',()=>{
  if(!me||mode==='edit'||document.querySelector('#ph iframe'))return;
  if(Date.now()-lastLoad<RELOAD_MS)return;
  loadAll();
});

/* ================= 메뉴 ================= */
$('#whoBtn').onclick=e=>{e.stopPropagation();const m=$('#whoMenu');m.classList.toggle('hidden');$('#whoBtn').setAttribute('aria-expanded',String(!m.classList.contains('hidden')))};
document.addEventListener('click',()=>$('#whoMenu').classList.add('hidden'));
$('#mOut').onclick=()=>logout();

$('#mImport').onclick=()=>openImport();

$('#mBackup').onclick=openBackup;
$('#mCsv').onclick=exportCsv;

/* ================= 권역 탭 ================= */
const SIZES=[[0,'전체'],[10000,'1만평↑'],[20000,'2만평↑'],[30000,'3만평↑']];
const sizeOk=b=>!minPy||(+b.gfa||0)>=minPy*PY;
const pubOk=b=>pubF==='all'||(pubF==='pub'?!!b.is_public:!b.is_public);
function inZone(b){return (zone==='all'||b.zone===zone)&&sizeOk(b)&&pubOk(b)}
function renderZones(){
  const sb2=buildings.filter(b=>sizeOk(b)&&pubOk(b));const cnt={};for(const b of sb2)cnt[b.zone]=(cnt[b.zone]||0)+1;
  // 2단 배치: 윗줄 지역(권역), 아랫줄 연면적 — 옆으로 스크롤하지 않도록 줄바꿈

/* ---------- 입체 빌딩 (three.js) ---------- */
const THREE_OK=!!window.THREE;
const FACES=[['front','정면'],['right','우측면'],['back','후면'],['left','좌측면']];
const OPP={front:'back',back:'front',left:'right',right:'left'};
// 입체 치수: 저장값이 없으면 연면적·층수로 대략 추정
function box(b){

let genericTex=null;
function getGeneric(){       // 사진이 없는 면: 창 한 칸 무늬를 층수·칸수만큼 반복

}
const facadeTex=new Map();   // 저장소 경로 → THREE.Texture | 'loading' | 'fail'
const boxes=new Map();       // 빌딩 id → {key, scene, matrix}
const rotX=THREE_OK?new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(1,0,0),Math.PI/2):null;
const box3d={id:'bld-3d',type:'custom',renderingMode:'3d',
  onAdd(m,gl){

    this.renderer.autoClear=false;this.renderer.outputEncoding=THREE.sRGBEncoding;

  render(gl,matrix){

function syncBoxes(){

function disposeScene(sc){sc.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)[].concat(o.material).forEach(mt=>mt.dispose())})}

function collect(){
  const f=$('#ef');if(!f)return;const v=n=>f.elements[n].value.trim();const num=n=>{const s=v(n).replace(/,/g,'');return s===''?null:+s};
  Object.assign(draft,{name:v('name'),address:v('address'),region:v('region')||null,district:v('district')||null,use_type:v('use_type'),owner:v('owner'),
    completed:v('completed'),floors_above:num('fa'),floors_below:num('fb'),memo:v('memo'),bid_keywords:v('bid_kw'),bid_orgs:v('bid_orgs'),lat:num('lat'),lng:num('lng'),verified:f.elements.verified.checked,is_public:f.elements.is_public.checked});
  draft.zoneAuto=v('zone')==='auto';draft.zone=draft.zoneAuto?autoZone(draft.region,draft.district):v('zone');
  const gm=num('gfa_m2');draft.gfa=gm;
  draft.fm=Object.assign({},draft.fm,{company:v('fm_company'),manager:v('fm_manager'),contact:v('fm_contact'),period:v('fm_period')});
  const st={};for(const [k] of CATS){const n=num('s_'+k)||0,c=v('c_'+k);if(n||c){const o=Object.assign({},draft.staff[k]||{},{n,company:c});if(o.company!==(draft.staff[k]||{}).company){delete o.source;delete o.checked_at}st[k]=o}}draft.staff=st;
  const m3=draft.model3d;m3.w=num('m3_w');m3.d=num('m3_d');m3.h=num('m3_h');m3.az=+f.elements.m3_az.value;
}
function cleanModel(m){
  const o={};for(const k of ['w','d','h'])if(m[k]!=null&&isFinite(m[k])&&m[k]>0)o[k]=Math.min(1000,+m[k]);
  if(m.az!=null&&isFinite(m.az))o.az=((Math.round(+m.az)%360)+360)%360;
  const f={};for(const [k] of FACES)if(m.faces&&m.faces[k])f[k]=m.faces[k];if(Object.keys(f).length)o.faces=f;
  if(m.vw&&m.vw.td_id)o.vw=m.vw;return o;
}

async function geocode(){

async function uploadPhotos(e){

function dirName(a){return ['북향','북동향','동향','남동향','남향','남서향','서향','북서향'][Math.round((+a||0)/45)%8]}
const facadeThumb=new Map();   // 방금 올린 외벽 사진의 미리보기 (경로 → dataURL)
async function facadeThumbs(d){
  const ks=FACES.map(([k])=>k).filter(k=>d.model3d.faces[k]);if(!ks.length)return;
  const paths=ks.map(k=>d.model3d.faces[k]).filter(p=>!facadeThumb.has(p));
  const urls=paths.length?await photoUrls(paths):[];const u=Object.fromEntries(paths.map((p,i)=>[p,urls[i]]));
  if(mode!=='edit'||draft!==d)return;
  for(const k of ks){const p=d.model3d.faces[k];const el=document.querySelector(`[data-ft="${k}"]`);const src=facadeThumb.get(p)||u[p];

}
const isHeic=f=>/heic|heif/i.test(f.type)||/\.(heic|heif)$/i.test(f.name);
const readURL=blob=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(r.error);r.readAsDataURL(blob)});
const decodeImg=url=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('decode'));i.src=url});
function loadHeic2any(){
  if(window.heic2any)return Promise.resolve();
  return new Promise((ok,no)=>{const sc=document.createElement('script');
    sc.src='https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';
    sc.integrity='sha384-OTofQ0MEeiSgh62havBcemCIK0gqj809wX6UA0uPISNMRnR6NZyCdGzX3SbLrgwL';sc.crossOrigin='anonymous';
    sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
}
async function addFacade(k,file){
  collect();const st=$('#fst');const d=draft;
  if(!/^image\//.test(file.type)&&!isHeic(file)){st.textContent='이미지 파일만 올릴 수 있어요 (JPG, PNG, HEIC).';return}
  st.textContent='사진을 여는 중…';
  let img;
  try{
    try{img=await decodeImg(await readURL(file))}
    catch(e){
      if(!isHeic(file))throw e;
      st.textContent='아이폰 사진(HEIC)을 JPG로 바꾸는 중…';
      await loadHeic2any();const out=await heic2any({blob:file,toType:'image/jpeg',quality:.9});
      img=await decodeImg(await readURL(Array.isArray(out)?out[0]:out));
    }
  }catch(_){st.textContent=isHeic(file)?'아이폰 사진(HEIC)을 열지 못했어요. JPG로 저장해서 다시 올려 주세요.':'사진을 열지 못했어요. JPG나 PNG로 다시 올려 주세요.';return}
  const MAX=2400,sc=Math.min(1,MAX/Math.max(img.naturalWidth,img.naturalHeight));
  const src=document.createElement('canvas');src.width=Math.round(img.naturalWidth*sc);src.height=Math.round(img.naturalHeight*sc);
  src.getContext('2d').drawImage(img,0,0,src.width,src.height);
  st.textContent='';
  const bx=box(d);const wm=(k==='front'||k==='back')?bx.w:bx.d;
  const out=await facadeEditor(FACES.find(f=>f[0]===k)[1],src,wm,bx.h);
  if(!out||draft!==d)return;
  st.textContent='외벽 사진을 올리는 중…';
  const blob=await new Promise(r=>out.toBlob(r,'image/jpeg',.88));
  const key=d.id||(d.id=crypto.randomUUID());
  const path=`${key}/facade-${k}-${crypto.randomUUID()}.jpg`;
  const {error}=await sb.storage.from('building-photos').upload(path,blob,{contentType:'image/jpeg',upsert:false});
  if(error){st.textContent='올리지 못했어요: '+error.message;return}
  if(THREE_OK){const t=new THREE.CanvasTexture(out);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;facadeTex.set(path,t)}
  const th=document.createElement('canvas');th.width=150;th.height=Math.round(out.height*150/out.width);th.getContext('2d').drawImage(out,0,0,th.width,th.height);
  facadeThumb.set(path,th.toDataURL('image/jpeg',.8));
  if(draft!==d)return;
  d.model3d.faces[k]=path;st.textContent='';syncBoxes();renderEdit();
  if(mapReady&&hasPos(d))flyToB(d);
}
/* 원근 보정: 사진 속 외벽 네 모서리를 반듯한 직사각형으로 편다 */
function facadeEditor(label,src,wm,hm){
  return new Promise(resolve=>{
    const m=modal(`<h2>${esc(label)} 원근 보정</h2>
      <p class="hint" style="margin:0">주황색 점 4개를 사진 속 외벽의 네 모서리(옥상 좌·우, 지면 좌·우)에 맞춰 끌어 놓으세요. 올려다보고 찍어 좁아진 윗부분이 반듯하게 펴져요.</p>
      <div class="fx"><div class="fxc" id="fxw"><canvas id="fxcv"></canvas></div><div class="fxp"><span class="hint">결과 미리보기</span><canvas id="fxpv"></canvas></div></div>
      <div class="actions"><button class="btn pri" id="fxOk" type="button">보정 적용</button><button class="btn" id="fxRaw" type="button">보정 없이 사용</button><button class="btn" id="fxX" type="button">취소</button></div>`);
    const cv=m.querySelector('#fxcv'),cx=cv.getContext('2d'),iw=src.width,ih=src.height;
    const pts=[{x:iw*.15,y:ih*.08},{x:iw*.85,y:ih*.08},{x:iw*.92,y:ih*.94},{x:iw*.08,y:ih*.94}];
    let s=1,drag=-1;
    const size=()=>{const w=m.querySelector('#fxw');const aw=Math.max(200,w.clientWidth-16),ah=Math.min(innerHeight*.55,560);s=Math.min(aw/iw,ah/ih);cv.width=Math.round(iw*s);cv.height=Math.round(ih*s)};
    const draw=()=>{
      cx.drawImage(src,0,0,cv.width,cv.height);const P=pts.map(p=>[p.x*s,p.y*s]);
      cx.fillStyle='rgba(0,0,0,.35)';cx.beginPath();cx.rect(0,0,cv.width,cv.height);cx.moveTo(...P[0]);cx.lineTo(...P[3]);cx.lineTo(...P[2]);cx.lineTo(...P[1]);cx.closePath();cx.fill();
      cx.strokeStyle='#F08A4B';cx.lineWidth=2;cx.beginPath();cx.moveTo(...P[0]);P.slice(1).forEach(p=>cx.lineTo(...p));cx.closePath();cx.stroke();
      const L=['옥상 좌','옥상 우','지면 우','지면 좌'];
      P.forEach((p,i)=>{cx.fillStyle='#C8581F';cx.beginPath();cx.arc(p[0],p[1],9,0,7);cx.fill();cx.strokeStyle='#fff';cx.lineWidth=2;cx.stroke();
        cx.font='600 12px sans-serif';cx.fillStyle='#fff';cx.fillText(L[i],p[0]+12,p[1]+(i<2?-10:18))});
    };
    const outSize=()=>{let W=1024,H=Math.round(W*hm/wm);if(H>4096){H=4096;W=Math.max(256,Math.round(H*wm/hm))}
      if(W*H>3.2e6){const f=Math.sqrt(3.2e6/(W*H));W=Math.round(W*f);H=Math.round(H*f)}return [W,Math.max(128,H)]};
    const preview=()=>{const [W,H]=outSize();const f=Math.min(1,140/W);const pw=Math.round(W*f),ph=Math.round(H*f);
      const o=warp(src,pts,pw,ph);const pv=m.querySelector('#fxpv');pv.width=pw;pv.height=ph;pv.getContext('2d').drawImage(o,0,0)};
    const at=e=>{const r=cv.getBoundingClientRect(),k=cv.width/r.width;return {x:Math.max(0,Math.min(cv.width,(e.clientX-r.left)*k)),y:Math.max(0,Math.min(cv.height,(e.clientY-r.top)*k))}};
    cv.addEventListener('pointerdown',e=>{const q=at(e);let bi=0,bd=1e9;pts.forEach((p,i)=>{const dd=Math.hypot(p.x*s-q.x,p.y*s-q.y);if(dd<bd){bd=dd;bi=i}});
      pts[bi]={x:q.x/s,y:q.y/s};drag=bi;cv.setPointerCapture(e.pointerId);draw()});
    cv.addEventListener('pointermove',e=>{if(drag<0)return;const q=at(e);pts[drag]={x:q.x/s,y:q.y/s};draw()});
    cv.addEventListener('pointerup',()=>{if(drag>=0){drag=-1;preview()}});
    const done=v=>{closeModal();resolve(v)};
    m.querySelector('#fxOk').onclick=()=>done(warp(src,pts,...outSize()));
    m.querySelector('#fxRaw').onclick=()=>done(warp(src,[{x:0,y:0},{x:iw,y:0},{x:iw,y:ih},{x:0,y:ih}],...outSize()));
    m.querySelector('#fxX').onclick=()=>done(null);
    requestAnimationFrame(()=>{size();draw();preview()});
  });
}
function homography(dst,src){   // 결과 좌표(u,v) → 원본 좌표(x,y)
  const A=[];
  for(let i=0;i<4;i++){const [u,v]=dst[i],[x,y]=src[i];A.push([u,v,1,0,0,0,-u*x,-v*x,x]);A.push([0,0,0,u,v,1,-u*y,-v*y,y])}
  const n=8;
  for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;[A[c],A[p]]=[A[p],A[c]];
    for(let r=0;r<n;r++){if(r===c)continue;const f=A[r][c]/A[c][c];for(let k=c;k<=n;k++)A[r][k]-=f*A[c][k]}}
  return A.map((r,i)=>r[n]/r[i]);
}
function warp(src,pts,W,H){
  const sd=src.getContext('2d').getImageData(0,0,src.width,src.height),s=sd.data,sw=src.width,sh=src.height;
  const [a,b,c,d,e,f,g,h]=homography([[0,0],[W,0],[W,H],[0,H]],pts.map(p=>[p.x,p.y]));
  const out=document.createElement('canvas');out.width=W;out.height=H;
  const oc=out.getContext('2d'),od=oc.createImageData(W,H),o=od.data;
  for(let v=0;v<H;v++)for(let u=0;u<W;u++){
    const den=g*u+h*v+1,x=(a*u+b*v+c)/den,y=(d*u+e*v+f)/den;
    const x0=Math.max(0,Math.min(sw-2,x|0)),y0=Math.max(0,Math.min(sh-2,y|0)),fx=Math.min(1,Math.max(0,x-x0)),fy=Math.min(1,Math.max(0,y-y0));
    const i00=(y0*sw+x0)*4,i10=i00+4,i01=i00+sw*4,i11=i01+4,oi=(v*W+u)*4;
    for(let ch=0;ch<3;ch++)o[oi+ch]=(s[i00+ch]*(1-fx)+s[i10+ch]*fx)*(1-fy)+(s[i01+ch]*(1-fx)+s[i11+ch]*fx)*fy;
    o[oi+3]=255;
  }
  oc.putImageData(od,0,0);return out;
}

    }catch(e){log('✖ '+e.message+keyHint(e.message))}
  };
  const winAll=async(rounds)=>{   // 개찰 지난 공고가 많으면 여러 번 나눠 확인
    let c=0,g=0,sg=0;
    for(let i=0;i<rounds;i++){
      const r=await bidCall({action:'winners',limit:40});
      c+=r.checked;g+=r.got;sg+=r.suggested||0;
      if(r.err)log('  ⚠ '+r.err+keyHint(r.err));
      if(!r.checked||!r.remain||r.err)break;
      log(`  … 낙찰자 확인 ${c}건 (남은 공고 ${r.remain})`);
    }
    return {c,g,sg};
  };
  m.querySelector('#bdWin').onclick=async()=>{
    log('낙찰자 확인 중…');
    try{const r=await winAll(8);log(`✔ 개찰 지난 공고 ${r.c}건 확인 · 낙찰자 ${r.g}건 · 관리사 검토 대기 ${r.sg}건 등록`);if(r.g||r.sg){await loadAll();renderPanel()}}
    catch(e){log('✖ '+e.message+keyHint(e.message))}
  };
  m.querySelector('#bdGo').onclick=async()=>{
    if(running)return;running=true;stop=false;
    const go=m.querySelector('#bdGo'),st=m.querySelector('#bdStop');go.disabled=true;st.disabled=false;
    const days=+m.querySelector('#bdDays').value,fmOnly=m.querySelector('#bdFm').checked;
    const list=[];for(let i=days-1;i>=0;i--){const d=new Date(Date.now()+9*3600e3-i*DAY);list.push(d.toISOString().slice(0,10).replace(/-/g,''))}
    let tot={scan:0,match:0,nw:0,calls:0};
    try{
      for(const [k,day] of list.entries()){
        if(stop)break;lastAct=Date.now();
        let r,tries=0;
        while(true){try{r=await bidCall({action:'run',day,fmOnly});break}
          catch(e){if(++tries>=3||/SERVICE|등록되지|인증|LIMITED|한도|관리자/.test(e.message))throw e;log(`  재시도 (${e.message})`);await new Promise(s=>setTimeout(s,3000))}}
        tot.scan+=r.scanned;tot.match+=r.matched;tot.nw+=r.newLinks;tot.calls+=r.calls;
        if(r.matched)log(`${day.slice(4,6)}/${day.slice(6)}: 용역 ${r.scanned}건 중 연결 ${r.matched}건 (새로 ${r.newLinks})`);
        m.querySelector('#bdBar').style.width=((k+1)/list.length*100).toFixed(1)+'%';
        m.querySelector('#bdSum').textContent=`진행 ${k+1}/${list.length}일 · 읽은 공고 ${tot.scan.toLocaleString()} · 연결 ${tot.match} · 새로 ${tot.nw} · API 호출 ${tot.calls}`;
      }
      log(stop?'— 멈췄어요.':'✔ 공고 확인 끝. 낙찰자도 확인해요…');
      if(!stop){try{const w=await winAll(10);log(`  낙찰자 ${w.g}/${w.c}건 확인 · 관리사 검토 대기 ${w.sg}건 등록`)}catch(e){log('  낙찰자 확인 실패: '+e.message+keyHint(e.message))}}
    }catch(e){log('✖ '+e.message+keyHint(e.message)+(/LIMITED|한도/.test(e.message)?' — 오늘 API 호출 한도를 다 썼어요. 내일 이어서 하세요.':''))}
    running=false;go.disabled=false;st.disabled=true;
    await loadAll();toast(`입찰공고 ${tot.nw}건을 새로 연결했어요`);
  };
}


/* ================= 영업 파이프라인 · 계약 만료 ================= */
async function loadSales(){
  const {data,error}=await sb.from('sales').select('*');
  salesOK=!error;sales=Object.fromEntries((data||[]).map(r=>[r.building_id,r]));
}
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const dDays=d=>Math.round((d-today0())/DAY);
const fmtD=d=>d?`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`:'';
const ymdStr=d=>d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`:'';
const ddayTxt=n=>n===0?'오늘':(n>0?'D-'+n:(-n)+'일 지남');
const dCls=n=>n<=0?'now':(n<=30?'soon':'');
function stageTag(b){const s=sales[b.id]?.stage;return s?`<span class="stag" style="background:${SCOL[s]}">${esc(SLBL[s])}</span>`:''}

/* 글에서 마지막 날짜 찾기: "2025.01 ~ 2027.12" → 2027-12-31 */
function lastDateIn(txt){
  const ms=[...String(txt||'').matchAll(/(20\d{2})\s*[.\-\/년]\s*(\d{1,2})?\s*[.\-\/월]?\s*(\d{1,2})?/g)];
  if(!ms.length)return null;
  const m=ms[ms.length-1],y=+m[1],mo=m[2]?Math.min(12,+m[2]):12,d=m[3]?+m[3]:0;
  return d?new Date(y,mo-1,d):new Date(y,mo,0);
}
/* 낙찰 공고에서 계약 만료 추정 */
function estFromBid(bd){
  const t=String(bd.title||'');
  const open=bd.open_at?new Date(bd.open_at):(bd.close_at?new Date(bd.close_at):null);
  const yrs=[...t.matchAll(/20\d{2}/g)].map(x=>+x[0]).filter(y=>y>=2015&&y<=2040);
  if(yrs.length){const y2=Math.max(...yrs);if(!open||y2>=open.getFullYear())return {d:new Date(y2,11,31),how:'공고명 연도'}}
  if(!open)return null;
  const mon=t.match(/(\d{1,2})\s*개월/),yy=t.match(/(\d)\s*년\s*간?/);
  const m=mon?+mon[1]:(yy?+yy[1]*12:12);
  const st=new Date(open);st.setMonth(st.getMonth()+1);
  const e=new Date(st.getFullYear(),st.getMonth()+m,0);
  return {d:e,how:(mon||yy)?'공고명 계약기간':'1년 계약 추정'};
}
const wonBidsOf=id=>bidLinks.filter(x=>x.building_id===id&&!x.hidden&&x.bids.winner&&!bidCanceled(x))
  .sort((a,b)=>new Date(b.bids.open_at||0)-new Date(a.bids.open_at||0));
function contractEnd(b){
  const s=sales[b.id];
  if(s&&s.contract_end)return {d:new Date(s.contract_end+'T00:00:00'),how:'직접 입력',sure:true};
  const p=lastDateIn(b.fm&&b.fm.period);
  if(p)return {d:p,how:'계약기간 입력값',sure:true};
  const w=wonBidsOf(b.id)[0];
  if(w){const e=estFromBid(w.bids);if(e)return {...e,sure:false,bid:w}}
  return null;
}
function expiryRows(zb,days){
  const out=[];
  for(const b of zb){const c=contractEnd(b);if(!c)continue;const n=dDays(c.d);if(n<-60||n>days)continue;out.push({b,c,n})}
  return out.sort((x,y)=>x.n-y.n);
}

function bindSales(root,b){
  const sv=root.querySelector('#sSave');
  if(sv)sv.onclick=async()=>{
    const st=root.querySelector('#sStage').value;
    const row={building_id:b.id,stage:st||'target',owner_id:root.querySelector('#sOwner').value||null,
      next_action:root.querySelector('#sAct').value.trim()||null,next_date:root.querySelector('#sDate').value||null,
      contract_end:root.querySelector('#sEnd').value||null};
    sv.disabled=true;
    const {error}=st?await sb.from('sales').upsert(row,{onConflict:'building_id'}):await sb.from('sales').delete().eq('building_id',b.id);
    sv.disabled=false;
    if(error)return toast(/does not exist|relation|schema cache/i.test(error.message)?'영업 저장 칸이 아직 없어요. supabase/10_sales_backup.sql 을 먼저 실행하세요.':'저장하지 못했어요: '+error.message);
    if(st)sales[b.id]=Object.assign({},sales[b.id],row);else delete sales[b.id];
    toast('영업 정보를 저장했어요');drawMarkers();renderDetail();
  };
  const add=root.querySelector('#aAdd');
  if(add)add.onclick=async()=>{
    const note=root.querySelector('#aNote').value.trim();
    if(!note)return toast('내용을 입력하세요');
    add.disabled=true;
    const {error}=await sb.from('sales_activities').insert({building_id:b.id,day:root.querySelector('#aDay').value||null,kind:root.querySelector('#aKind').value,note});
    add.disabled=false;
    if(error)return toast('기록하지 못했어요: '+error.message);
    root.querySelector('#aNote').value='';toast('활동을 기록했어요');loadActs(b);
  };
  loadActs(b);
}
async function loadActs(b){
  if(!$('#actList'))return;
  const {data,error}=await sb.from('sales_activities').select('*').eq('building_id',b.id).order('day',{ascending:false}).order('id',{ascending:false}).limit(50);
  const el=$('#actList');if(!el||selId!==b.id)return;
  if(error){el.innerHTML='<li class="m">활동 기록을 불러오지 못했어요.</li>';return}
  if(!data||!data.length){el.innerHTML='<li class="m">아직 기록이 없어요.</li>';return}
  el.innerHTML=data.map(a=>`<li>${canEdit()&&(a.user_id===me.id||isAdmin())?`<button class="x" type="button" data-adel="${a.id}">지우기</button>`:''}
    <span class="m">${esc(a.day)} · ${esc(a.kind)} · ${esc(names[a.user_id]||'')}</span><div>${esc(a.note)}</div></li>`).join('');
  el.querySelectorAll('[data-adel]').forEach(x=>x.onclick=async()=>{
    const {error}=await sb.from('sales_activities').delete().eq('id',+x.dataset.adel);
    if(error)return toast('지우지 못했어요: '+error.message);
    loadActs(b);
  });

/* ================= 건축물대장(건축HUB) 가져오기 (관리자) ================= */
async function importCall(body){

  if(error){let msg=error.message;try{const j=await error.context.json();msg=j.error||msg}catch(_){}throw new Error(msg)}

}
let impStop=false;
function openImport(){

      <div class="hint" id="imKindH"></div></div>
    <label class="keep"><input type="checkbox" id="imSkip" checked> 이미 끝낸 시군구는 건너뛰기</label>
    <div class="actions"><button class="btn" id="imProbe" type="button">연결 확인</button><button class="btn pri" id="imGo" type="button">가져오기 시작</button><button class="btn" id="imStop" type="button" disabled>멈춤</button><button class="btn" id="imX" type="button">닫기</button></div>

  let running=false;const keep=setInterval(()=>{if(running)lastAct=Date.now()},60000);
  m.querySelector('#imX').onclick=()=>{if(running){impStop=true}closeModal();if(running)toast('가져오기를 멈췄어요. 다시 열어 이어서 할 수 있어요.')};
  m.querySelector('#imStop').onclick=()=>{impStop=true;log('— 멈추는 중 (지금 처리 중인 구간까지 마무리)')};
  const kindSel=m.querySelector('#imKind'),kindH=m.querySelector('#imKindH');

    kindH.textContent=pub?'주용도코드(공공업무시설)·기타용도·건물명(청사·시청·구청·공단·공사·우체국·법원 등)으로 공공청사를 가려요. 이미 등록된 빌딩이 공공청사면 ‘공공’ 표시만 붙여요. 오피스와 따로 진행 기록을 남겨서 처음부터 훑어요.':''};
  m.querySelector('#imProbe').onclick=async()=>{
    log('연결 확인 중…');
    try{const r=await importCall({action:'probe'});
      log(`✔ 연결됨 · 역삼동 건축물 ${r.total.toLocaleString()}건 중 ${r.got}건을 한 번에 받음`);
      log(`  예시: ${[r.sample.이름,r.sample.주소,r.sample.주용도,r.sample.연면적&&Math.round(r.sample.연면적).toLocaleString()+'㎡'].filter(Boolean).join(' · ')}`);
    }catch(e){log('✖ '+e.message)}
  };
  m.querySelector('#imGo').onclick=async()=>{
    if(running)return;running=true;impStop=false;
    const go=m.querySelector('#imGo'),st=m.querySelector('#imStop');go.disabled=true;st.disabled=false;

    let tot={ins:0,found:0,dup:0,nogeo:0,calls:0,flag:0},zero=[],nearAll=[],oddAll=[];
    try{
      const plan=(await importCall({action:'plan',regions,mode:kind})).list;
      const todo=plan.filter(p=>!(skip&&p.last&&p.last.done));
      log(`시군구 ${plan.length}곳 중 ${todo.length}곳을 처리해요.`);
      const CH=2;let k=0;const steps=todo.reduce((a,p)=>a+Math.ceil(p.n/CH),0);
      for(const p of todo){

          let r,tries=0;
          while(true){try{r=await importCall({action:'run',sgg:p.sgg,from,to:Math.min(p.n,from+CH),minArea,rows:100,mode:kind});break}
            catch(e){if(++tries>=3||/한도|LIMITED|SERVICE_KEY|서비스키|초과|등록되지|관리자/.test(e.message))throw e;log(`  재시도 (${e.message})`);await new Promise(s=>setTimeout(s,3000))}}
          pIns+=r.inserted;pFound+=r.found;pScan+=r.scanned;
          tot.ins+=r.inserted;tot.flag+=r.flagged||0;tot.found+=r.found;tot.dup+=r.dup;tot.nogeo+=r.noGeo;tot.calls+=r.calls;

          for(const x of r.skipped||[]){log(`  − 건너뜀: ${x.name} ↔ 기존 ‘${x.by}’${x.m!=null?' '+x.m+'m':''} (${x.why})`);if(x.m==null)oddAll.push(x)}
          for(const x of r.near||[]){log(`  ! 가까움: ${x.name} — 기존 ‘${x.by}’와 ${x.m}m, 이름이 달라 등록했어요`);nearAll.push(x)}
          if(r.geoErr&&!tot.geoWarn){tot.geoWarn=1;log(`  ⚠ 카카오 주소 검색 오류 ${r.geoErr} — 카카오 개발자 사이트에서 '카카오맵' 사용 설정을 켜 주세요. (좌표 없이 등록돼요)`)}
          k++;m.querySelector('#imBar').style.width=(k/steps*100).toFixed(1)+'%';
          m.querySelector('#imSum').textContent=`진행 ${k}/${steps} · 새로 등록 ${tot.ins}${kind==='public'?' · 공공 표시 '+tot.flag:''} · 이미 있음 ${tot.dup} · 좌표 없음 ${tot.nogeo} · API 호출 ${tot.calls.toLocaleString()}`;
        }
        if(impStop)break;
        if(!pScan)zero.push(p.name);
        log(`${p.name}: 건축물 ${pScan.toLocaleString()}건 확인 · 기준 이상 ${pFound} · 새로 등록 ${pIns}`);
      }
      log(impStop?'— 멈췄어요. 다시 시작하면 끝난 시군구는 건너뛰어요.':'✔ 끝났어요.');
      if(nearAll.length)log(`⚠ 가까운 기존 빌딩과 이름이 달라 등록한 곳 ${nearAll.length}곳 — 같은 빌딩이면 하나를 지우세요: ${nearAll.map(x=>x.name+'↔'+x.by).join(', ')}`);
      if(oddAll.length)log(`⚠ 주소는 같은데 이름이 다른 곳 ${oddAll.length}곳 — 기존 빌딩 주소가 틀렸을 수 있어요: ${oddAll.map(x=>x.name+'↔'+x.by).join(', ')}`);
      if(zero.length)log(`⚠ 결과가 0건인 곳: ${zero.join(', ')} — 행정구역이 바뀐 곳(부천·화성·인천 일부 등)은 코드 업데이트가 필요할 수 있어요.`);
    }catch(e){log('✖ '+e.message+(/LIMITED|한도/.test(e.message)?' — 오늘 API 호출 한도를 다 썼어요. 내일 이어서 하세요.':''))}
    running=false;go.disabled=false;st.disabled=true;
    if(tot.ins||tot.flag){await loadAll();toast(`빌딩 ${tot.ins}곳 새로 등록${tot.flag?` · ${tot.flag}곳 공공 표시`:''}`)}
  };
}

/* ================= 빌딩 사진 찾기 (카카오 이미지 검색 → 골라서 저장) ================= */
const srcHost=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(_){return ''}};
async function photoCall(body){
  const {data,error}=await sb.functions.invoke('photo-search',{body});
  if(error){let msg=error.message;try{const j=await error.context.json();msg=j.error||msg}catch(_){}
    if(/Failed to send|not found|404/i.test(msg))msg='사진 찾기 서버 함수(photo-search)가 아직 없어요. 설치가이드를 확인하세요.';throw new Error(msg)}
  if(data&&data.error)throw new Error(data.error);return data;
}
/* ids: 특정 빌딩만(상세·편집에서) / null: 현재 권역에서 사진 없는 빌딩을 차례로.  ed: 편집 중인 draft (있으면 draft 에만 넣고 저장은 편집 화면에서) */
function openPhotoFinder(ids,ed){
  if(!canEdit())return;
  const queue=ids?ids.slice():buildings.filter(b=>inZone(b)&&!(b.photos||[]).length).map(b=>b.id);
  if(!queue.length){toast('이 권역에 사진 없는 빌딩이 없어요');return}
  let i=0,page=1,items=[],q='',loading=false,saved=0,end=false;const done=new Set();
  const cur=()=>ed||buildings.find(x=>x.id===queue[i]);
  const defQ=b=>{const n=String(b.name||'').trim();const dist=String(b.district||'').replace(/\s/g,'');
    return /[0-9]/.test(n)&&/(로|길)\s*\d/.test(n)?`${b.address||n} 빌딩`:`${n} ${dist}`.trim()};
  const m=modal(`<div class="pf-head"><h2 id="pfName"></h2><span class="hint" id="pfCnt"></span></div>
    <div class="hint" id="pfAddr"></div>
    <form class="pf-q" id="pfForm" onsubmit="return false"><input id="pfQ" aria-label="검색어"><button class="btn" type="submit">검색</button></form>
    <div class="hint" style="margin-top:6px">맞는 사진을 누르면 바로 저장돼요(여러 장 가능). 사진은 출처와 함께 기록되고, 사내 확인용으로만 쓰세요.</div>
    <div class="pf-grid" id="pfGrid"></div>
    <div class="err" id="pfErr"></div>
    <div class="pf-nav"><button class="btn" id="pfMore" type="button">다른 사진 더 보기</button><a class="hint" id="pfRv" target="_blank" rel="noopener noreferrer">로드뷰로 비교 ↗</a><span class="sp"></span>
      ${queue.length>1?'<button class="btn" id="pfPrev" type="button">← 이전</button><button class="btn pri" id="pfNext" type="button">다음 빌딩 →</button>':''}
      <button class="btn" id="pfX" type="button">닫기</button></div>`);
  const grid=m.querySelector('#pfGrid'),err=m.querySelector('#pfErr');
  const drawGrid=()=>{grid.innerHTML=items.length?items.map((x,k)=>`<button type="button" data-k="${k}" class="${done.has(x.image)?'done':''}" title="${esc(x.site||srcHost(x.doc))} · ${x.w}×${x.h}"><img src="${esc(x.thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer"><span>${esc(x.site||srcHost(x.doc))}</span></button>`).join('')
      :`<div class="hint" style="grid-column:1/-1;padding:20px 0">${loading?'찾는 중…':'결과가 없어요. 검색어를 바꿔 보세요.'}</div>`;
    grid.querySelectorAll('[data-k]').forEach(el=>el.onclick=()=>pick(+el.dataset.k,el))};
  const search=async more=>{
    if(loading)return;loading=true;err.textContent='';if(!more){items=[];page=1;end=false}drawGrid();
    try{const r=await photoCall({action:'search',q,page});const seen=new Set(items.map(x=>x.image));
      items=items.concat(r.items.filter(x=>!seen.has(x.image)));end=r.end}catch(e){err.textContent=e.message}
    loading=false;drawGrid();m.querySelector('#pfMore').disabled=end;
  };
  const load=()=>{
    const b=cur();if(!b)return;
    m.querySelector('#pfName').textContent=b.name;
    m.querySelector('#pfAddr').textContent=[b.address,b.gfa?fmtPy(b.gfa):''].filter(Boolean).join(' · ');
    m.querySelector('#pfCnt').textContent=queue.length>1?`사진 없는 빌딩 ${i+1} / ${queue.length} · 이번에 저장 ${saved}장`:`저장 ${saved}장`;
    const rv=m.querySelector('#pfRv');if(hasPos(b)){rv.href=`https://map.kakao.com/link/roadview/${+b.lat},${+b.lng}`;rv.style.display=''}else rv.style.display='none';
    q=defQ(b);m.querySelector('#pfQ').value=q;done.clear();search(false);
    if(m.querySelector('#pfPrev'))m.querySelector('#pfPrev').disabled=i===0;
    if(m.querySelector('#pfNext'))m.querySelector('#pfNext').disabled=i>=queue.length-1;
  };
  const pick=async(k,el)=>{
    const x=items[k],b=cur();if(!x||!b||done.has(x.image)||el.classList.contains('busy'))return;
    el.classList.add('busy');err.textContent='';
    try{
      if(!ed)await ensureFull(b);   // 기존 사진 출처를 받아놓아야 덮어쓰지 않아요
      const r=await photoCall({action:'save',id:b.id,image:x.image,thumb:x.thumb,doc:x.doc});
      const src={url:x.doc||x.image,site:x.site||srcHost(x.doc),at:new Date().toISOString().slice(0,10),...(r.small?{small:true}:{})};
      if(ed){ed.photos.push(r.path);ed.photo_src=Object.assign({},ed.photo_src,{[r.path]:src})}
      else{
        const photos=[...(b.photos||[]),r.path];const row={photos};
        if(HAS.photo_src)row.photo_src=Object.assign({},b.photo_src,{[r.path]:src});
        const u=await sb.from('buildings').update(row).eq('id',b.id).select('id');
        if(u.error||!u.data||!u.data.length){photoCall({action:'discard',path:r.path}).catch(()=>{});throw new Error(u.error?u.error.message:'저장 권한이 없어요.')}
        b.photos=photos;if(row.photo_src)b.photo_src=row.photo_src;
      }
      done.add(x.image);saved++;el.classList.remove('busy');el.classList.add('done');
      m.querySelector('#pfCnt').textContent=queue.length>1?`사진 없는 빌딩 ${i+1} / ${queue.length} · 이번에 저장 ${saved}장`:`저장 ${saved}장`;
      if(r.small)err.textContent='원본을 받을 수 없어 작은 사진(썸네일)으로 저장했어요.';
    }catch(e){el.classList.remove('busy');err.textContent=e.message}
  };
  m.querySelector('#pfForm').onsubmit=()=>{q=m.querySelector('#pfQ').value.trim();if(q)search(false);return false};
  m.querySelector('#pfMore').onclick=()=>{if(!end){page++;search(true)}};
  if(m.querySelector('#pfNext'))m.querySelector('#pfNext').onclick=()=>{if(i<queue.length-1){i++;load()}};
  if(m.querySelector('#pfPrev'))m.querySelector('#pfPrev').onclick=()=>{if(i>0){i--;load()}};
  m.querySelector('#pfX').onclick=()=>{closeModal();
    if(ed){if(mode==='edit'&&draft===ed)renderEdit()}
    else if(saved){if(mode==='detail'){phTab='photo';renderDetail()}else renderPanel()}};
  load();
}

const pwRule=p=>p.length>=10&&/[A-Za-z]/.test(p)&&/\d/.test(p);
function openPwModal(forced){

      <div class="f" style="display:grid;gap:4px"><label for="np2">새 비밀번호 확인</label><input id="np2" type="password" autocomplete="new-password"></div>

      <div class="err" id="npErr"></div></form>`);
  m.querySelector('#np1').focus();
  if(m.querySelector('#npX'))m.querySelector('#npX').onclick=closeModal;
  if(m.querySelector('#npOut'))m.querySelector('#npOut').onclick=()=>{closeModal();logout()};
  m.querySelector('#npSave').onclick=async()=>{
    const a=m.querySelector('#np1').value,b=m.querySelector('#np2').value,e=m.querySelector('#npErr');
    if(!pwRule(a)){e.textContent='10자 이상, 영문과 숫자를 섞어 주세요.';return}
    if(a!==b){e.textContent='두 비밀번호가 달라요.';return}
    const {error}=await sb.auth.updateUser({password:a});
    if(error){e.textContent=/same/i.test(error.message)?'지금 비밀번호와 다른 비밀번호를 쓰세요.':'변경하지 못했어요: '+error.message;return}
    await sb.rpc('mark_pw_changed');me.must_change_pw=false;closeModal();toast('비밀번호를 바꿨어요');
  };
}

    </form>
    <div class="err" id="nu_err"></div>
    <h3>계정 목록</h3><div class="tbl" id="ulist">불러오는 중…</div>
    <div class="actions"><button class="btn" id="adX">닫기</button></div>`);
  m.querySelector('#adX').onclick=closeModal;
  m.querySelector('#nu_go').onclick=async()=>{
    const e=m.querySelector('#nu_err');e.textContent='';const pw=tempPw();
    try{await adminCall({action:'create',login_id:m.querySelector('#nu_id').value.trim().toLowerCase(),name:m.querySelector('#nu_nm').value.trim(),role:m.querySelector('#nu_role').value,password:pw});
      e.style.color='var(--ok)';e.textContent=`만들었어요. 임시 비밀번호: ${pw}  — 본인에게 직접 전달하세요. 첫 로그인 때 바꾸게 돼요.`;
      m.querySelector('#nu_id').value='';m.querySelector('#nu_nm').value='';loadUsers(m)}
    catch(x){e.style.color='';e.textContent=x.message}};
  loadUsers(m);
}
async function loadUsers(m){
  const box=m.querySelector('#ulist');
  let users;try{users=(await adminCall({action:'list'})).users}catch(x){box.textContent='불러오지 못했어요: '+x.message;return}
  box.innerHTML=`<table><thead><tr><th>아이디</th><th>이름</th><th>권한</th><th>상태</th><th>마지막 로그인</th><th></th></tr></thead><tbody>${users.map(u=>`<tr data-id="${esc(u.id)}">
    <td>${esc(u.login_id)}</td><td>${esc(u.name)}</td>
    <td><select data-act="role" ${u.id===me.id?'disabled':''}>${['viewer','editor','admin'].map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${{viewer:'조회자',editor:'편집자',admin:'관리자'}[r]}</option>`).join('')}</select></td>
    <td>${u.active?'사용':'<span class="flag">중지</span>'}${u.must_change_pw?' <span class="hint">(임시 비번)</span>':''}</td>
    <td class="hint">${u.last_login_at?esc(new Date(u.last_login_at).toLocaleString('ko-KR')):'—'}</td>
    <td style="white-space:nowrap">${u.id===me.id?'<span class="hint">본인</span>':`<button class="btn" data-act="active">${u.active?'중지':'재사용'}</button> <button class="btn" data-act="reset">비번 초기화</button>`}</td></tr>`).join('')}</tbody></table>
    <div class="err" id="ulErr"></div>`;
  const err=box.querySelector('#ulErr');
  box.querySelectorAll('tr[data-id]').forEach(tr=>{
    const id=tr.dataset.id,u=users.find(x=>x.id===id);
    tr.querySelector('[data-act="role"]').onchange=async e=>{try{await adminCall({action:'update',id,role:e.target.value});toast('권한을 바꿨어요')}catch(x){err.textContent=x.message;loadUsers(m)}};
    const ab=tr.querySelector('[data-act="active"]');if(ab)ab.onclick=async()=>{try{await adminCall({action:'update',id,active:!u.active});loadUsers(m)}catch(x){err.textContent=x.message}};
    const rb=tr.querySelector('[data-act="reset"]');if(rb)rb.onclick=async()=>{const pw=tempPw();try{await adminCall({action:'reset_password',id,password:pw});err.style.color='var(--ok)';err.textContent=`${u.login_id} 임시 비밀번호: ${pw}`}catch(x){err.style.color='';err.textContent=x.message}};
  });
}


/* ================= 백업 (관리자) ================= */
const kb=n=>n>=1048576?(n/1048576).toFixed(1)+'MB':Math.max(1,Math.round((n||0)/1024))+'KB';
function openBackup(){
  if(!isAdmin())return;
  const m=modal(`<h2>백업 · 내려받기</h2>
    <p class="hint" style="margin:0">빌딩·영업·활동기록·관리사 검토·입찰자료를 통째로 저장해 둬요. <b>매주 월요일 새벽 3시</b>에 자동으로 만들고 최근 12개를 보관해요. 컴퓨터에도 한 부 내려받아 두면 더 안전해요.</p>
    <div class="actions"><button class="btn pri" id="bkNew" type="button">지금 백업 만들기</button><button class="btn" id="bkX" type="button">닫기</button></div>
    <div class="err" id="bkErr"></div>
    <div class="tbl" id="bkList" style="margin-top:10px">불러오는 중…</div>`);
  m.querySelector('#bkX').onclick=closeModal;
  const err=m.querySelector('#bkErr');
  const list=async()=>{
    const box=m.querySelector('#bkList');
    const {data,error}=await sb.from('backups').select('id,at,kind,rows,size').order('at',{ascending:false});
    if(error){box.textContent=/does not exist|relation|schema cache/i.test(error.message)?'백업 칸이 아직 없어요. Supabase 에서 supabase/10_sales_backup.sql 을 실행하세요.':'불러오지 못했어요: '+error.message;return}
    if(!data||!data.length){box.textContent='아직 백업이 없어요.';return}
    box.innerHTML=`<table><thead><tr><th>만든 때</th><th>종류</th><th>자료 수</th><th>크기</th><th></th></tr></thead><tbody>${data.map(b=>`<tr><td>${esc(new Date(b.at).toLocaleString('ko-KR'))}</td><td>${b.kind==='auto'?'자동':'수동'}</td><td>${n0(b.rows)}건</td><td>${esc(kb(b.size))}</td><td><button class="btn" type="button" data-bk="${b.id}">내려받기</button></td></tr>`).join('')}</tbody></table>`;
    box.querySelectorAll('[data-bk]').forEach(el=>el.onclick=async()=>{
      el.disabled=true;err.style.color='';err.textContent='';
      const {data:d,error:e2}=await sb.from('backups').select('at,data').eq('id',+el.dataset.bk).maybeSingle();
      el.disabled=false;
      if(e2||!d){err.textContent='내려받지 못했어요: '+(e2?e2.message:'없는 백업');return}
      const a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([JSON.stringify(d.data)],{type:'application/json'}));
      a.download=`빌딩정보_백업_${new Date(d.at).toISOString().slice(0,10)}.json`;a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    });
  };
  m.querySelector('#bkNew').onclick=async()=>{
    const b=m.querySelector('#bkNew');b.disabled=true;err.style.color='';err.textContent='백업하는 중…';
    const {error}=await sb.rpc('make_backup',{p_kind:'manual'});
    b.disabled=false;
    if(error){err.textContent=/does not exist|function/i.test(error.message)?'백업 기능이 아직 없어요. Supabase 에서 supabase/10_sales_backup.sql 을 실행하세요.':'백업하지 못했어요: '+error.message;return}
    err.style.color='var(--ok)';err.textContent='백업했어요.';list();
  };
  list();
}

/* ================= CSV ================= */
function exportCsv(){
  if(!canEdit())return;
  const head=['빌딩명','권역','시도','시군구','주소','연면적(㎡)','연면적(평)','지상층','지하층','준공','용도','소유주','관리회사(시설)','PM','담당자','연락처','계약기간',...CATS.flatMap(([,l])=>[l+'인원',l+'협력사']),'총인원','위도','경도','확인','공공','영업단계','영업담당','다음할일','다음날짜','계약만료','만료근거'];
  const rows=visible().map(b=>[b.name,ZNAME[b.zone]||'',b.region,b.district,b.address,b.gfa,b.gfa?Math.round(b.gfa/PY):'',b.floors_above,b.floors_below,b.completed,b.use_type,b.owner,b.fm?.company,b.fm?.pm,b.fm?.manager,b.fm?.contact,b.fm?.period,
    ...CATS.flatMap(([k])=>[b.staff?.[k]?.n||0,b.staff?.[k]?.company]),staffTotal(b),b.lat,b.lng,b.verified?'Y':'N',b.is_public?'Y':'N',
    SLBL[sales[b.id]?.stage]||'',names[sales[b.id]?.owner_id]||'',sales[b.id]?.next_action||'',sales[b.id]?.next_date||'',
    (()=>{const c=contractEnd(b);return c?fmtD(c.d):''})(),(()=>{const c=contractEnd(b);return c?(c.sure?'':'추정 · ')+c.how:''})()]);
  const cell=x=>{x=String(x??'');if(/^[=+\-@]/.test(x))x="'"+x;return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x};
  const csv='\ufeff'+[head,...rows].map(r=>r.map(cell).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`빌딩정보_${ZNAME[zone]}_${new Date().toISOString().slice(0,10)}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
